[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-digital-life"
version = "0.1.0"
description = "我会永远陪着你 integrated companion host"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3"]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# AstrBot installs requirements.txt directly; deriving Requires-Dist from the same
# file keeps the built package metadata and the runtime install contract identical.
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["digital_life_core*"]
